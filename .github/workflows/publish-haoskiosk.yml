name: Publish HAOSKiosk image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish ARM64 image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./haoskiosk
          file: ./haoskiosk/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/cayouche1989/haoskiosk:1.3.1-welizard.15
          build-args: |
            BUILD_VERSION=1.3.1-welizard.15
            BUILD_ARCH=aarch64
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base:3.24-2026.06.1
